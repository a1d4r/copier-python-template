# Pipelines run for merge requests, the default branch, tags and schedules
# (e.g. a weekly schedule to re-run `audit` on the default branch).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  # Keep in sync with the uv stage in Dockerfile.
  UV_VERSION: "0.13.0"
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  # Use the image's Python (the version from .python-version), never download one.
  UV_PYTHON_DOWNLOADS: never

default:
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python3.14-trixie-slim
  interruptible: true

stages:
  - lint
  - test
  - audit
  - build

# Jobs call the Makefile targets, like developers and GitHub Actions do.
.uv:
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make > /dev/null
    - uv sync --locked
  after_script:
    - uv cache prune --ci
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR

lint:
  extends: .uv
  stage: lint
  script: make lint

codequality:
  extends: .uv
  stage: lint
  script: make codequality
  artifacts:
    reports:
      codequality:
        - reports/ruff-codequality.json
        - reports/mypy-codequality.json
    when: always
    expire_in: 1 week

test:
  extends: .uv
  stage: test
  script: make test
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
      junit: reports/junit.xml
    when: always
    expire_in: 1 week

audit:
  extends: .uv
  stage: audit
  needs: []
  # `make audit` reads uv.lock only, no environment is needed.
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make > /dev/null
  script: make audit
  rules:
    # A newly published vulnerability is not caused by the merge request, so it
    # does not block merging; on the default branch, tags and schedules it fails.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
    - when: on_success

# Builds the production stage without pushing it. Needs a runner that allows
# Docker-in-Docker (privileged), like the GitLab.com instance runners.
docker-build:
  stage: build
  needs: []
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --target production --tag "example-app:$CI_COMMIT_SHORT_SHA" .
