[project]
name = "example-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[project.scripts]
example-app = "example_app.__main__:main"

# Dev tools: lower bounds only, exact versions live in uv.lock (`make update`).
[dependency-groups]
lint = [
    "deptry>=0.25.1",
    "mypy>=2.4.0",
    "ruff>=0.17.0",
    "mypy-gitlab-code-quality>=1.3.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "pre-commit>=4.6.2",
]

[build-system]
# uv recommends an upper bound for uv_build (its own release cadence); bump it with uv.
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./example_app, not in ./src.
module-name = "example_app"
module-root = ""

[tool.mypy]
# https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
files = ["example_app", "tests"]
python_version = "3.14"
junit_xml = "reports/mypy.xml"
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
color_output = true
plugins = ["pydantic.mypy"]
strict = true  # https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# Prefer typed packages or `types-*` stubs in the `lint` group. For a library
# without type hints, silence it explicitly instead of globally:
# [[tool.mypy.overrides]]
# module = ["untyped_lib", "untyped_lib.*"]
# ignore_missing_imports = true

[tool.pydantic-mypy]
# https://docs.pydantic.dev/latest/integrations/mypy/#configuring-the-plugin
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
# https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
minversion = "9.0"
strict = true  # strict config, markers, xfail and parametrize ids
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = [
  "--color=yes",
  "--failed-first",
  "--tb=short",
  "--verbosity=2",
  "--cov",
  "--cov-report=term",
  "--cov-report=xml",
  "--junitxml=reports/junit.xml",
]

[tool.coverage.run]
# https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
data_file = "reports/.coverage"
source = ["example_app"]
# Entry points only wire things together; they run in the app, not in unit tests.
omit = ["example_app/__main__.py"]

[tool.coverage.report]
# https://coverage.readthedocs.io/en/latest/config.html#report
fail_under = 80
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.xml]
# https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.ruff]
# https://docs.astral.sh/ruff/settings/#top-level
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/settings/#lint
select = ["ALL"]
ignore = [
  "D", # pydocstyle
  "TD", # flake8-todos
  "FIX", # flake8-fixme
  "ANN", # flake8-annotations (handled by mypy)
  "EM", # flake8-errmsg - String literals in exceptions
  "E501", # pycodestyle - line too long (handled by formatter)
  "COM812", # forced by ruff formatter
  "ISC001", # forced by ruff formatter
  "TRY003", # long message for exceptions
  "EM101", # allow string literals for exceptions
  "EM102", # allow f-string literals for exceptions
  # Opinionated rules that `select = ["ALL"]` would pick up on a ruff upgrade:
  "CPY", # flake8-copyright - copyright notices (stabilized in ruff 0.17)
  "DOC", # pydoclint - docstring sections, like "D" above (preview)
  "RUF105", # `ruff: ignore` instead of `noqa` comments (preview)
  "RUF201", # rule names instead of codes in the ruff config (preview)
]
unfixable = [
  "F", # pyflakes
  "ERA", # eradicate - commented-out code
]
allowed-confusables = [
  "а", "А", "б", "Б", "в", "В", "г", "Г", "е", "Е", "з", "З", "и", "И", "к", "К", "м", "М",
  "н", "Н", "о", "О", "р", "Р", "с", "С", "т", "Т", "у", "У", "ф", "Ф", "х", "Х"  # Allow cyrillic letters
]

[tool.ruff.lint.per-file-ignores]
# https://docs.astral.sh/ruff/settings/#lint_per-file-ignores
"__init__.py" = [
  "F401", # Unused import
  "F403", # Import star
]
"tests/**/*.py" = [
  "S101", # Use of assert detected (assert allowed in tests)
  "ARG001", # Unused function argument (fixtures requested only for their side effects)
  "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.flake8-tidy-imports]
# https://docs.astral.sh/ruff/settings/#lintflake8-tidy-imports
ban-relative-imports = "all"

[tool.ruff.lint.flake8-boolean-trap]
# https://docs.astral.sh/ruff/settings/#lintflake8-boolean-trap
extend-allowed-calls = ["pydantic.Field", "django.db.models.Value"]

[tool.ruff.lint.flake8-builtins]
# https://docs.astral.sh/ruff/settings/#lintflake8-builtins
builtins-ignorelist = ["id"]

[tool.ruff.lint.flake8-bugbear]
# https://docs.astral.sh/ruff/settings/#lintflake8-bugbear
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi_filter.FilterDepends"]

[tool.ruff.lint.flake8-type-checking]
# https://docs.astral.sh/ruff/settings/#lintflake8-type-checking
exempt-modules = ["typing", "typing_extensions"]
# Pydantic needs the annotations of its models at runtime.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lintisort
section-order = ["future", "typing", "standard-library", "third-party", "first-party", "local-folder"]
lines-between-types = 1
split-on-trailing-comma = false

[tool.ruff.lint.isort.sections]
# https://docs.astral.sh/ruff/settings/#lint_isort_sections
"typing" = ["typing", "types", "typing_extensions", "mypy", "mypy_extensions"]

[tool.ruff.lint.pep8-naming]
# https://docs.astral.sh/ruff/settings/#lintpep8-naming
classmethod-decorators = [
  # Allow Pydantic's validator decorators to trigger class method treatment.
  "pydantic.field_validator",
  "pydantic.model_validator",
  # Allow SQLAlchemy's dynamic decorators, like `@field.expression`, to trigger class method treatment.
  "declared_attr",
  "expression",
  "comparator",
]

[tool.ruff.lint.pycodestyle]
# https://docs.astral.sh/ruff/settings/#lintpycodestyle
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
# https://docs.astral.sh/ruff/settings/#lintpydocstyle
convention = "google"

[tool.ruff.lint.pylint]
# https://docs.astral.sh/ruff/settings/#lintpylint
allow-dunder-method-names = ["__tablename__", "__table_args__"]
allow-magic-value-types = ["int", "str", "bytes"]
max-args = 10
max-branches = 15
max-statements = 30

[tool.ruff.format]
# https://docs.astral.sh/ruff/settings/#format
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = true
